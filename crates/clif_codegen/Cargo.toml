[package]
name = "clif_codegen"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
gc-stress = ["runtime/gc-stress"]

[dependencies]
hir = { path = "../hir" }
mir = { path = "../mir" }
util_macros = { path = "../util_macros" }
runtime = { path = "../runtime" }

cranelift = { version = "0.133.1" }
cranelift-module = { version = "0.133.1" }
cranelift-jit = { version = "0.133.1" }
cranelift-native = { version = "0.133.1" }
cranelift-reader = { version = "0.133.1" }
la-arena = { version = "0.3.1" }
itertools = { version = "0.12.1" }
ryu = { version = "1.0" }
proc-macro2 = { version = "1.0.43" }
smallvec = { version = "1.14.0" }
text-size = { version = "1.1.1" }
bytemuck = { version = "*" }
